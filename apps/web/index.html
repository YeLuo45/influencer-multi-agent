<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IMA · Influencer Multi-Agent Console</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hdr">
    <div class="hdr-inner">
      <h1>IMA 控制台</h1>
      <nav class="tabs" role="tablist">
        <button data-tab="contents" class="tab active">内容</button>
        <button data-tab="queue" class="tab">发布队列</button>
        <button data-tab="feedback" class="tab">反馈</button>
        <button data-tab="ab" class="tab">A/B 报告</button>
      </nav>
    </div>
  </header>
  <main class="main">
    <section id="view-contents" class="view active">
      <h2>内容列表</h2>
      <div id="content-list" class="card-list"></div>
    </section>
    <section id="view-queue" class="view">
      <h2>发布队列</h2>
      <div id="queue-summary" class="summary"></div>
      <div id="queue-list" class="card-list"></div>
    </section>
    <section id="view-feedback" class="view">
      <h2>反馈窗口</h2>
      <div id="feedback-summary" class="summary"></div>
    </section>
    <section id="view-ab" class="view">
      <h2>A/B 报告</h2>
      <div id="ab-controls">
        <input id="ab-content-id" type="text" placeholder="content id" />
        <button id="ab-load">加载</button>
        <span class="hint">（输入 content id，例如 c-xxx）</span>
      </div>
      <pre id="ab-output" class="pre"></pre>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
